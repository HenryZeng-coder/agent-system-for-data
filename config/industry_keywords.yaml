# ============================================================
# IT行业关键词库 v1 — 分层识别精度优化
# 供 FilterPipeline / business_spider / tech_spider 等共用
# ============================================================
#
# 匹配策略 (FilterPipeline):
#   1. 命中 exclude_keywords 且未命中 strong → DropItem (排除词优先)
#   2. 命中任一 strong_keywords → 保留
#   3. 命中 medium >= 2 个 → 保留
#   4. 命中 medium >= 1 且 weak >= 1 → 保留
#   5. 否则 DropItem

# ---- 强信号词: 单独命中即判定为IT企业 ----
strong_keywords:
  - "软件开发"
  - "软件"
  - "信息技术"
  - "人工智能"
  - "AI"
  - "云计算"
  - "大数据"
  - "互联网"
  - "系统集成"
  - "数字化"
  - "网络安全"
  - "信息安全"
  - "物联网"
  - "区块链"
  - "工业互联网"
  - "信创"
  - "国产化"
  - "低代码"
  - "SaaS"
  - "PaaS"
  - "IaaS"
  - "智能"
  - "IT"

# ---- 中等信号词: 需2个或配合弱词 ----
medium_keywords:
  - "数据"
  - "科技"
  - "信息化"
  - "智慧"
  - "芯片"
  - "集成电路"
  - "半导体"
  - "机器人"
  - "自动化"
  - "嵌入式"
  - "数字"
  - "云"
  - "网络"
  - "电子"
  - "通信"
  - "光电"
  - "北斗"
  - "数字孪生"
  - "元宇宙"
  - "AR"
  - "VR"
  - "鸿蒙"
  - "数据库"
  - "中间件"
  - "运维"
  - "测试"

# ---- 弱信号词: 需配合中词/强词 ----
weak_keywords:
  - "技术"
  - "研发"
  - "平台"
  - "系统"
  - "服务"
  - "方案"
  - "科技园"
  - "产业园"

# ---- 排除词: 命中即视为非IT (除非同时命中强词) ----
exclude_keywords:
  - "劳务派遣"
  - "人力资源服务"
  - "家政服务"
  - "餐饮管理"
  - "物业管理"
  - "房地产"
  - "建筑工程"
  - "装饰工程"
  - "贸易"
  - "销售代理"
  - "物流"
  - "运输"
  - "农业"
  - "养殖"
  - "食品"
  - "服装"
  - "珠宝"
  - "美容"
  - "健身"
  - "教育咨询"
  - "法律咨询"
  - "会计"
  - "税务"
  - "旅行社"
  - "酒店管理"

# ---- 细分行业标签: 用于 business_spider 打标 + tech_spider 技术栈识别 ----
# 每类含多个触发词, 命中任一即打该标签
industry_tags:
  人工智能: ["人工智能", "AI", "机器学习", "深度学习", "NLP", "大模型", "LLM", "计算机视觉", "CV", "自然语言处理", "AIGC", "生成式"]
  云计算: ["云计算", "云服务", "云原生", "SaaS", "PaaS", "IaaS", "容器", "kubernetes", "docker", "微服务"]
  大数据: ["大数据", "数据分析", "数据挖掘", "数据治理", "数据中台", "BI", "数据仓库"]
  软件开发: ["软件开发", "软件设计", "信息系统", "应用软件", "编程", "开发", "低代码", "APP", "小程序"]
  物联网: ["物联网", "IoT", "传感器", "嵌入式", "车联网"]
  网络安全: ["网络安全", "信息安全", "等保", "攻防", "零信任", "防火墙", "漏洞"]
  系统集成: ["系统集成", "信息化建设", "智能化工程", "智慧城市"]
  信创: ["信创", "国产化", "自主可控", "鲲鹏", "麒麟", "统信", "UOS", "鸿蒙", "欧拉"]
  区块链: ["区块链", "智能合约", "Web3", "数字人民币", "NFT"]
  工业互联网: ["工业互联网", "工业软件", "MES", "ERP", "数字孪生", "边缘计算", "SCADA"]
  半导体: ["芯片", "集成电路", "半导体", "IC设计", "光电子", "光纤", "光模块"]
  数字创意: ["数字创意", "AR", "VR", "元宇宙", "数字人", "游戏", "动漫", "CG"]
  通信技术: ["通信", "5G", "6G", "基站", "光通信", "卫星互联网"]
